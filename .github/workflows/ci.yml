name: CI
on:
  push: { branches: [main] }
  pull_request:
  schedule:
    - cron: '17 6 * * 1'   # weekly: new advisories and browser/axe updates are caught without a code change

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod
      - run: pnpm typecheck
      - name: Install Chromium for the browser audits
        run: npx playwright-core install --with-deps chromium
      - run: pnpm test
